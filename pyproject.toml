[project]
name = "genx-se"
version = "0.1.0"
description = "Visualisation and data tooling for the GenX-SE Sweden 4-zone case"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
]

[project.optional-dependencies]
# Pulled in only when fetching real ENTSO-E data — keeps the default
# install fast for plot-only users.
entsoe = [
    "entsoe-py>=0.6",
    "python-dotenv>=1.0",
    "pyarrow>=15.0",
]

[tool.uv]
package = false
