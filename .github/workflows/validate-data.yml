name: Validate Data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  csv-structure:
    name: CSV structure & cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync

      - name: Validate CSV structure
        run: make validate

  regenerate-timeseries:
    name: build_timeseries.py is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Python deps
        run: uv sync

      - name: Regenerate synthetic timeseries
        run: make timeseries

      - name: Confirm regeneration produces identical files (deterministic seed)
        run: git diff --exit-code system/Demand_data.csv system/Generators_variability.csv system/Fuels_data.csv
