name: Format Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  julia-format:
    name: JuliaFormatter (SciML style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Format check (fail on diff)
        run: make fmt-check
