name: Format Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  julia-format:
    name: JuliaFormatter (SciML style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.add(PackageSpec(name = "JuliaFormatter", version = "1"))'

      - name: Run formatter (check only — no writes)
        run: |
          julia -e '
            using JuliaFormatter
            ok = format(".", verbose = true, overwrite = false)
            if !ok
              println(stderr, "Formatting issues detected. Run JuliaFormatter locally:")
              println(stderr, "  julia -e \"using JuliaFormatter; format(\\\".\\\")\"")
              exit(1)
            end
          '
