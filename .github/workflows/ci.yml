name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    name: Run + plot (Julia ${{ matrix.julia-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.9', '1.10', '1']
        os: [ubuntu-latest]
        include:
          - julia-version: '1'
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Julia + Python deps
        run: make install

      - name: Run case (fast — TDR=1)
        run: make run-fast

      - name: Assert key result files exist
        shell: bash
        run: |
          test -f results/costs.csv
          test -f results/capacity.csv
          test -f results/power.csv
          echo "--- costs.csv ---"
          cat results/costs.csv
          echo "--- capacity.csv (head) ---"
          head -20 results/capacity.csv

      - name: Render plots (PNG + interactive HTML)
        run: make plot

      - name: Upload results CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-julia-${{ matrix.julia-version }}
          path: results/
          if-no-files-found: warn

      - name: Upload plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plots-${{ matrix.os }}-julia-${{ matrix.julia-version }}
          path: plots/output/
          if-no-files-found: warn
