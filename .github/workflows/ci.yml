name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    name: Run case (Julia ${{ matrix.julia-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.9', '1.10', '1']
        os: [ubuntu-latest]
        include:
          - julia-version: '1'
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install GenX into the project
        run: julia --project=. -e 'using Pkg; Pkg.add("GenX"); Pkg.instantiate()'

      - name: Force TDR for CI (fast smoke test)
        shell: bash
        run: |
          # Ensure TimeDomainReduction is on so CI runs in <1 min
          sed -i.bak 's/^TimeDomainReduction:.*/TimeDomainReduction: 1/' settings/genx_settings.yml
          rm settings/genx_settings.yml.bak
          grep TimeDomainReduction settings/genx_settings.yml

      - name: Run Sweden 4-zone case
        run: julia --project=. --color=yes Run.jl

      - name: Assert results were written
        shell: bash
        run: |
          test -f results/costs.csv
          test -f results/capacity.csv
          test -f results/power.csv
          echo "--- costs.csv ---"
          cat results/costs.csv
          echo "--- capacity.csv ---"
          head -20 results/capacity.csv

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-julia-${{ matrix.julia-version }}
          path: results/
          if-no-files-found: warn
