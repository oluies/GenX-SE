name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    name: Run + plot (Julia ${{ matrix.julia-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1.9 ar borttagen: Julia 1.9.4 startar inte langre pa ubuntu-latest.
        # Dess libopenlibm.so kraver exekverbar stack, vilket karnan i
        # runner-bilden nekar:
        #   ERROR: Unable to load dependent library .../lib/julia/libopenlibm.so
        #   cannot enable executable stack as shared object requires: Invalid argument
        # Inget i repot andrades - runner-bilden gjorde det (20261111). 1.9 ar
        # dessutom EOL. 1.10 och 1 tackar den stodda ytan.
        julia-version: ['1.10', '1']
        os: [ubuntu-latest]
        include:
          - julia-version: '1'
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      # Pinnad till v3 i stallet for @latest. @latest ar en rorlig referens:
      # CI kan ga sonder utan att en rad andras i repot, vilket ar precis vad
      # som hande har. Resten av workflowen pinnar redan (cache@v2 och ett par
      # SHA:n), sa det har var undantaget. Renovate kan folja v3.
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Julia + Python deps
        run: make install

      - name: Run case (fast — TDR=1)
        run: make run-fast

      - name: Assert key result files exist
        shell: bash
        run: |
          test -f results/costs.csv
          test -f results/capacity.csv
          test -f results/power.csv
          echo "--- costs.csv ---"
          cat results/costs.csv
          echo "--- capacity.csv (head) ---"
          head -20 results/capacity.csv

      - name: Render plots (PNG + interactive HTML)
        run: make plot

      - name: Upload results CSVs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.os }}-julia-${{ matrix.julia-version }}
          path: results/
          if-no-files-found: warn

      - name: Upload plots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plots-${{ matrix.os }}-julia-${{ matrix.julia-version }}
          path: plots/output/
          if-no-files-found: warn
